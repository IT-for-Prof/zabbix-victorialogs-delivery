    template: Vector log shipper by Zabbix agent
    name: Шиппер логов Vector через агент Zabbix
    description: |
      Опережающие признаки на стороне отправителя для шиппера логов Vector, только на встроенных ключах агента Zabbix. На наблюдаемый хост ничего не ставится: ни скрипта, ни UserParameter, ни правки конфига.

      Нужен Zabbix agent 2 ради ключа systemd, версии 7.0 или новее — ради таймаута 30 с у двух обходов каталога. Агент постарше игнорирует таймаут элемента и берёт Timeout из своего файла конфигурации, по умолчанию 3 секунды. На обход большого буфера этого мало, и проверка падает как раз тогда, когда сигнал буфера важнее всего. На старом агенте вместо этого поднимите Timeout в zabbix_agent2.conf.

      Что измеряется:
      - состояние юнита шиппера в systemd и его счётчик автоматических перезапусков: юнит в цикле падений при каждом опросе выглядит active;
      - размер дискового буфера Vector как минимум за час: сырой размер ходит от 0 до 128 МиБ при каждой смене сегмента, даже когда доставка полностью здорова;
      - положительный контроль: в пути буфера действительно есть файлы.

      Зачем положительный контроль. vfs.dir.size отвечает 0 для несуществующего каталога, без ошибки и без состояния unsupported, а записи, которые не может прочитать, пропускает и не падает. Неверный макрос пути, шиппер с буфером в памяти или подкаталог с данными, куда агент не может войти, — во всех трёх случаях элемент размера навсегда показывает здоровое число, и его триггер не может сработать. Контроль считает файлы в пути вместо байтов. Существующий каталог никогда не весит ровно 0 байт, потому что учитываются иноды самих каталогов, и контроль по размеру ни одного из этих случаев не увидит.

      Когда перестаёт отвечать сам агент, все три элемента агента замолкают одновременно. Тогда родительский триггер над всеми тремя поднимает одну проблему вместо трёх по элементам.

      НЕ измеряется: доходят ли логи до приёмника на самом деле. Это видно только на приёмнике. Для этого привяжите парный шаблон «Доставка логов в VictoriaLogs по HTTP».

      Макросы:
      - VECTOR.UNIT: имя юнита systemd, по умолчанию vector.service.
      - VECTOR.AGENT.WINDOW: сколько все три элемента должны молчать вместе, чтобы агент считался пропавшим, по умолчанию 10m.
      - VECTOR.RESTARTS.WARN: сколько автоматических перезапусков за час нужно, чтобы юнит считался в цикле падений, по умолчанию 2.
      - VECTOR.BUFFER.DIR: каталог буфера, по умолчанию /var/lib/vector/buffer. Обходится дважды за интервал: для размера и для подсчёта файлов.
      - VECTOR.BUFFER.WARN: байты, по умолчанию половина max_size 512 МиБ.
      - VECTOR.BUFFER.HIGH: байты, по умолчанию 90 % от max_size 512 МиБ. При when_full = block полный буфер останавливает чтение хостом собственного журнала.

      Если max_size в синке Vector на хосте отличается от 512 МиБ, поменяйте оба порога в байтах под него.

      Автор:    Константин Тютюнник
      Сайт:     https://itforprof.com
      Лицензия: MIT (c) 2026 Konstantin Tyutyunnik
