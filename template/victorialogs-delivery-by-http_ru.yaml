    template: VictoriaLogs delivery by HTTP
    name: Доставка логов в VictoriaLogs по HTTP
    description: |
      Мониторинг доставки логов в VictoriaLogs со стороны приёмника.

      Отправители берутся из самих логов. Каждая метка VictoriaLogs, прошедшая фильтр меток, через минуту после своей первой строки становится наблюдаемым отправителем. Группа хостов, токен API и шаг регистрации, который можно забыть, не нужны.

      Обычное возражение против обнаружения целей из наблюдаемого сигнала: умерший хост пропадает из данных вместе со своим алертом, и как раз тогда, когда проблема хуже всего. Здесь его снимает настройка правила обнаружения, второй реестр не нужен. Потерянные ресурсы никогда не отключаются и удаляются только через 30 дней. Отправитель, который перестал слать логи, сохраняет свой элемент, получает сентинел 99999999 и продолжает алертить.

      Цена — обратный случай. У отправителя, где шиппер установлен, но не доставил ни одной строки, метки нет вовсе, и обнаруживать нечего. Демон, его перезапуски и буфер покрывает парный шаблон для отправителя; хост, от которого не пришло ни строки, этот шаблон не видит.

      Поэтому вывод отправителя из эксплуатации — отдельное действие, и если его забыть, придёт алерт. ДО остановки шиппера исключите метку через LOG.LABEL.EXCLUDE или отключите обнаруженный элемент вручную. Если сначала остановить шиппер, элемент будет алертить до 30 дней.

      Что измеряется:
      - возраст самой свежей строки лога, дошедшей до VictoriaLogs, по каждому отправителю;
      - живость цепочки сбора — корень зависимостей для всех триггеров по отправителям;
      - отправитель, у которого спешат часы: иначе он молча отодвигает собственный срок алерта.

      Чего шаблон по устройству НЕ измеряет:
      - Полноту. Шаблон подтверждает, что недавно пришла строка с этой меткой; пришло ли всё, он не знает. После долгого простоя шиппер заново отправляет буфер с исходным временем строк, поэтому триггер по отправителю закрывается сразу после возобновления доставки, хотя очередь ещё разбирается. То, что не поместилось в буфер, не попадает ни в один отчёт. Конвейер, потерявший один из нескольких источников, тоже остаётся зелёным, пока под той же меткой идёт хоть один.
      - Отправителя, который ни разу ничего не прислал. См. выше.
      - Причину остановки доставки. Для этого привяжите к отправителю парный шаблон «Шиппер логов Vector через агент Zabbix».

      Макросы:
      - VL.WINDOW: окно поиска LogsQL, подставляется как _time:>now-VL.WINDOW. Правая граница открыта намеренно. Запись _time:VL.WINDOW означала бы закрытый диапазон от «сейчас минус окно» до «сейчас» и отбрасывала бы строки со временем из будущего. Тогда отправитель со спешащими часами пропал бы из результата и не показал бы отрицательный возраст, который ищет триггер расхождения часов. Окно не должно превышать срок хранения VictoriaLogs. Оно же горизонт обнаружения: метка, которая молчит дольше окна, перестаёт обнаруживаться, а её элемент удаляется через 30 дней.
      - LOG.LABEL.MATCHES: обнаруживается только метка, подходящая под это выражение. Значение по умолчанию пропускает то, что безопасно становится частью ключа элемента; метка с пробелом или кавычкой отклоняется, чтобы не сломать ключ.
      - LOG.LABEL.EXCLUDE: метки, подходящие под это выражение, не обнаруживаются никогда. Значение по умолчанию ^$ ничего не исключает. Сюда идут разовые зонды, тестовые метки и выведенные отправители — всё, что пишет в VictoriaLogs, но не должно мониториться как отправитель.
      - LOG.LAG.WARN: через сколько секунд отправитель считается опоздавшим, по умолчанию 900. Чтобы изменить порог для одного отправителя, задайте на хосте-приёмнике контекстный макрос с ключом по метке отправителя в VictoriaLogs. Имя хоста в Zabbix здесь не подходит: шаблон не обращается к объектам хостов Zabbix.
      - LOG.CLOCKSKEW.WARN: на сколько секунд могут спешить часы отправителя, прежде чем об этом сообщается, по умолчанию 60. Оба триггера расхождения часов сравнивают возраст лога с этим значением со знаком минус.

      Требования: VictoriaLogs доступна с сервера Zabbix, host — поле потока (stream field).

      Автор:    Константин Тютюнник
      Сайт:     https://itforprof.com
      Лицензия: MIT (c) 2026 Konstantin Tyutyunnik
