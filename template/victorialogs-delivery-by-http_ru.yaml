    - uuid: 5c8f76e0bd0a4ba08448c755e3fd2064
      name: Свежесть отправителей в VictoriaLogs
      type: HTTP_AGENT
      key: log.freshness.raw
      delay: 1m
      history: '0'
      value_type: TEXT
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var lines = value.split('\n');
          var out = [];
          for (var i = 0; i < lines.length; i++) {
              var s = lines[i].trim();
              if (s.length === 0) { continue; }
              if (s.slice(-1) !== '}') { throw 'truncated NDJSON line from VictoriaLogs'; }
              var o = JSON.parse(s);
              if (typeof o.host !== 'string' || o.age === undefined) { throw 'VictoriaLogs freshness row is missing host or age - query or LogsQL semantics changed'; }
              out.push(o);
          }
          if (out.length === 0) { throw 'VictoriaLogs returned no senders'; }
          return JSON.stringify(out);
      timeout: 10s
      url: '{$VL.URL}/select/logsql/query'
      query_fields:
      - name: query
        value: _time:>now-{$VL.WINDOW} | stats by (host) max(_time) as last | math (now() - last) / 1e9 as age | filter host:* | fields host, age
      tags:
      - tag: component
        value: freshness
      - tag: scope
        value: availability
