        priority: WARNING
        description: 'Возраст лога — это «сейчас у приёмника» минус время, которое контролирует отправитель, а запрос берёт максимум, поэтому хватает одного события с датой из будущего. Пока отправитель здоров, он выглядит лучше правильного хоста: отрицательный возраст проходит любой порог. Когда он перестанет слать логи, алерт придёт позже ровно на величину расхождения, и предела у этой задержки нет. Найдите отправителя с расхождением и исправьте его часы или разбор времени в логах.'
        dependencies:
